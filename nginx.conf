server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión gzip para mejor rendimiento
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # Caché para assets estáticos con hash (Angular los genera con hash en producción)
    location ~* \.[0-9a-f]{8,}\.(js|css|woff2?|ttf|eot|ico|png|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Service Worker — nunca cachear (siempre debe ser el más reciente)
    location = /ngsw.json {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
    location = /ngsw-worker.js {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # PWA manifest
    location = /manifest.webmanifest {
        add_header Content-Type application/manifest+json;
    }

    # SPA fallback — todas las rutas devuelven index.html (Angular Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
