server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # ── Proxy al backend (Spring Boot en Render) ─────────────────────────────
    # Todas las llamadas /api/* se reenvían al backend.
    # Así el frontend no necesita CORS y el browser ve un solo origen.

    # SSE endpoint — deshabilitar buffering para que los eventos lleguen en tiempo real
    location = /api/v1/notifications/sse {
        proxy_pass         https://control-operations-agent-backend-spring.onrender.com;
        proxy_http_version 1.1;
        proxy_set_header   Host control-operations-agent-backend-spring.onrender.com;
        proxy_set_header   Connection '';
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # Resto de endpoints API
    location /api/ {
        proxy_pass         https://control-operations-agent-backend-spring.onrender.com;
        proxy_http_version 1.1;
        proxy_set_header   Host control-operations-agent-backend-spring.onrender.com;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Assets estáticos (Angular genera nombres con hash en producción) ───────
    location ~* \.(js|css|woff2|woff|ttf|eot|ico|png|svg|webp|gif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Service Worker — nunca cachear ────────────────────────────────────────
    location = /ngsw.json {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
    location = /ngsw-worker.js {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ── PWA manifest ──────────────────────────────────────────────────────────
    location = /manifest.webmanifest {
        add_header Content-Type application/manifest+json;
    }

    # ── SPA fallback — Angular Router ─────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
